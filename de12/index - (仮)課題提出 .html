    <style>
    /* 上部の固定文字設定 */
    /*ray's portforio*/
    .top-left-fixed{
        position: fixed
        top: 10px;
        left: 10px;
        font-size: 18px;
        color: #708090; /* カラーコードslategray */
        x-index: 9999; /* ほかの要素より手前に表示 */
        background-color: #dcdcdc; /* カラーコードgainsboro */
        padding: 4px 8px; /* 内側の余白 */
        border-radius: 4px;
    }
    /*基本設定：ここから*/
    /* 背景色設定 */
    body{
        background-color: #fffafa; /* カラーコードsnow */
        margin: 0; /* 内側の余白 */
        min-height: 100vh; /* 要素の高さの最小値を100％にする */
    }
    /*外枠(はみ出た部分を隠す)*/
    .wrap{
        width: 100%;
        overflow: hidden;
        display: flex;
    }
    /*横並びにする部分*/
    .slideshow{
        display: flex;
        width: max-content;
        animation: slideMove 20s linear infinite;
    }
    /*各スライドのタイトル*/
    .content{
        width: 400px;
        height: 60px;
        background-color: #d3d3d3;/*カラーコードlightgray*/
        margin-right: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    /*アニメーションの定義*/
    @keyframes slideMove {
        0%{
            transform: translateX(-50%);
        }
    }
    /*マウスを乗せたときに動きを止める*/
    .slideshow:hover {
        animation-play-state: paused;
    }
    /*基本設定：ここまで*/
    .timeline-container {
        width: flex;
        margin: 50px 200px;
        color: #808080;
    }

    .timeline-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #808080;
        padding-bottom: 8px;
        margin-bottom: 40px;
        font-size: 40px;
        font-weight: bold;
    }
    .timeline-header a{
        color:#808080;
        text-decoration: none;
    }
    .timeline-header a:hover{
        text-decoration: underline;
    }
    .timeline {
        position: relative;
    }
    .timeline::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        background-color: #808080;
        transform: translateX(-50%)
    }
    .item {
        display: grid;
        grid-template-columns: 1fr 30px 1fr; /*左側/中央(丸用幅)/右側*/
        align-items: center;
        margin-bottom: 35px;
    }
    /*中央の黒丸*/
    .center-dot {
        grid-column: 2;
        width: 20px;
        height: 20px;
        background-color: #808080;
        border-radius: 50%;
        justify-self: center;
        z-index: 1;
    }
    /*中央のリンク・日付スタイル*/
    .item a {
        color: #808080;
        text-decoration: none;
        font-size: 25px;
    }
    .item a:hover {
        text-decoration: underline;
    }
    .item .date {
        font-size: 16px;
        font-weight: bold;
        color:#808080;
    }
    /*横の引き出し線*/
    .item .line {
        flex-grow: 1;
        height: 1px;
        background-color: #808080;
    }
    /*A,左側にリンクがある場合*/
    .left-link .content-left {
        display: flex;
        align-items: center;
        justify-content: flex-end;
    }
    .left-link .content-left .line {
        margin-left: 12px;/*文字と線の間の隙間*/
    }
    .left-link .content-right {
        display: flex;
        align-items: center;
        padding-left: 8px;/*丸と日付の間の隙間*/
    }
    /*B,右側にリンクがある場合*/
    .right-link .content-left {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 8px;
    }
    .right-link .content-right {
        display: flex;
        align-items: center;
    }
    .right-link .content-right .line {
        margin-right: 12px;
    }
    </style>
</head>
