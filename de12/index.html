    <style>
    /* 上部の固定文字設定 */
    .top-left-fixed{
        position: fixed
        top: 10px;
        left: 10px;
        font-size: 18px;
        color: #708090; /* カラーコードslategray */
        x-index: 9999; /* ほかの要素より手前に表示 */
        background-color: #dcdcdc; /* カラーコードgainsboro */
        padding: 4px 8px; /* 内側の余白 */
        border-radius: 4px;
    }
    /* 背景色設定 */
    body{
        background-color: #fffafa; /* カラーコードsnow */
        margin: 0; /* 内側の余白 */
        min-height: 100vh; /* 要素の高さの最小値を100％にする */
    }
    /*外枠(はみ出た部分を隠す)*/
    .wrap{
        width: 100%;
        overflow: hidden;
        display: flex;
    }
    /*横並びにする部分*/
    .slideshow{
        display: flex;
        width: max-content;
        animation: slideMove 20s linear infinite;
    }
    /*各スライドのタイトル*/
    .content{
        width: 400px;
        height: 60px;
        background-color: #d3d3d3;/*カラーコードlightgray*/
        margin-right: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    /*アニメーションの定義*/
    @keyframes slideMove {
        0%{
            transform: translateX(-50%);
        }
    }
    /*マウスを乗せたときに動きを止める*/
    .slideshow:hover {
        animation-play-state: paused;
    }
    /*画像横並びの設定*/
    .image-link-box {
        display: flex;         /* 横並びにする */
        gap: 30px;             /* 画像と画像の間のすき間 */
        justify-content: center; /* 中央に配置 */
        margin: 0px 30px 10px 30px;
    }
    .image-link-box a {
        display: block;      /* リンクのクリックエリアを画像全体に広げる */
        max-width: 100%;     /* 親要素からはみ出さないようにする */
    } 
    /* 画像（imgタグ）のレスポンシブ対応 */
    .image-link-box img {
        width: 100%;         /* 幅いっぱいに広げる */
        height: auto;        /* 縦横比を維持する */
        vertical-align: bottom; /* 画像の下に謎の隙間ができるのを防ぐ */
        justify-content: center;
    }
    /* マウスを乗せたときの処理 */
    .floating-img:hover {
         /* Y軸（縦方向）に-10px移動させて上に浮かせる */
        transform: translateY(-10px);
      
        /* ぼかした影をつけて立体感を出す */
        /* 構造: 左右のズレ 上下のズレ ぼかしの強さ 影の色 */
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }



    </style>
</head>
