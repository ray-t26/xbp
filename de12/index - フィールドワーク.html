<!DOCTYPE html>
<html lang="jp"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base target="_self">
    <title>XBP_Ray's フィールドワークnote</title>
    <link rel="icon" href="../images/favicon.XR.PNG" sizes="any"> <!--ファビコン設定-->
    <style>
    /* 上部の固定文字設定 */
    .top-left-fixed{
        position: fixed
        top: 10px;
        left: 10px;
        font-size: 18px;
        color: #708090; /* カラーコードslategray */
        x-index: 9999; /* ほかの要素より手前に表示 */
        background-color: #dcdcdc; /* カラーコードgainsboro */
        padding: 4px 8px; /* 内側の余白 */
        border-radius: 4px;
    }
    /* 背景色設定 */
    body{
        background: linear-gradient(to bottom, #fffafa 0%, #dcdcdc 70%, #696969 100%);
        margin: 0; /* 内側の余白 */
        min-height: 100vh; /* 要素の高さの最小値を100％にする */
    }

    .text-container{
        display: flex;
        justify-content: space-between;
        width: 100%;
    }
    .left-text{
        color: #c0c0c0;
        font-size: 170px;
        text-align: left;
    }
    .logo-WORK{
        color: #c0c0c0;
        font-size: 170px;
        text-align: left;
        position: relative;
        bottom: 50px;
    }
    .right-text{
        color: #696969;
        font-size: 20px;
        text-align: center;
        margin-top: 220px;
        margin-right: 70px;
    }
    .short-text{
        font-size: 25px;
        color: #c0c0c0;
        text-align: right;
        position: relative;
        top: 10px;
    }
    .content{
        color: #fffafa;
    }
    </style>
</head>
<body>
    <div class="top-left-fixed">Ray's Portfolio</div>

    <div class="text-container">
        <span class="left-text">
            FIELD<br>
            <div class="short-text">フィールドワーク</div>
            <span class="logo-WORK">WORK</span>
        </span>
        <span class="right-text">
            
            メディアと実際に目で見るのは違う。<br>
            思い込みの間違いに気づき、当たり前が当たり前でないと気付く。<br></span>
    </div>

<div class="content">
    <h2>フィールドワーク演習ノート</h2>
<br>
<br>
</div>


</body>
</html>
