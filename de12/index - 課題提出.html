        overflow: hidden;
        display: flex;

    .slideshow{
        display: flex;
        width: max-content;
        animation: slideMove 20s linear infinite;

    /*各スライドのタイトル*/

        width: 400px;
        height: 60px;
        background-color: #d3d3d3;/*カラーコードlightgray*/
        margin-right: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    /*アニメーションの定義*/
    @keyframes slideMove {
        0%{
            transform: translateX(-50%);
        }
    }
    /*マウスを乗せたときに動きを止める*/
    .slideshow:hover {
        animation-play-state: paused;
    }
