    /* 上部の固定文字設定 */
    .top-left-fixed{
        position: fixed
        top: 10px;
        left: 10px;
        font-size: 18px;
        color: #708090; /* カラーコードslategray */
        x-index: 9999; /* ほかの要素より手前に表示 */
        background-color: #dcdcdc; /* カラーコードgainsboro */
        padding: 4px 8px; /* 内側の余白 */
        border-radius: 4px;
    }
    /* 背景色設定 */
    body{
        background-color: #fffafa; /* カラーコードsnow */
        margin: 0; /* 内側の余白 */
        min-height: 100vh; /* 要素の高さの最小値を100％にする */
    }
    /*外枠(はみ出た部分を隠す)*/
    .wrap{
        width: 100%;
        overflow: hidden;
        display: flex;
    }
    /*横並びにする部分*/
    .slideshow{
        display: flex;
        width: max-content;
        animation: slideMove 20s linear infinite;
    }
    /*各スライドのタイトル*/
    .content{
        width: 400px;
        height: 60px;
        background-color: #d3d3d3;/*カラーコードlightgray*/
        margin-right: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    /*アニメーションの定義*/
    @keyframes slideMove {
        0%{
            transform: translateX(-50%);
        }
    }
    /*マウスを乗せたときに動きを止める*/
    .slideshow:hover {
        animation-play-state: paused;
    }
    .image-container {
        display: flex;          /* 横並びにする */
        gap: 16px;              /* 画像と画像の間のすき間 */
        justify-content: center;/* 中央揃え（左揃えなら flex-start） */
        align-items: center;    /* 縦位置を揃える */
    }
       /*画像横並びの設定*/
    .image-link-box {
        display: flex;         /* 横並びにする */
        gap: 50px;             /* 画像と画像の間のすき間 */
        justify-content: center; /* 中央に配置 */
        margin: 0px 30px 50px 30px;
    }
    .image-link-box a {
        display: block;      /* リンクのクリックエリアを画像全体に広げる */
        max-width: 100%;     /* 親要素からはみ出さないようにする */
    } 
    /* 画像（imgタグ）のレスポンシブ対応 */
    .image-link-box img {
        width: 100%;         /* 幅いっぱいに広げる */
        height: auto;        /* 縦横比を維持する */
        vertical-align: bottom; /* 画像の下に謎の隙間ができるのを防ぐ */
        justify-content: center;
    }
    /* 文字の調整（必要に応じて） */
    .image-link-box p {
        display: flex;
        margin: 0;                 /* 余計な余白を消す */
        font-size: 60px;           /* 文字の大きさ */
        color:#708090;
        justify-content: center; /* 左右方向の中央揃え */
        align-items: center;     /*上下方向の中央揃え*/
    }
